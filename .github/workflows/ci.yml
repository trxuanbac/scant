name: Release gates

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: release-gates-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  policy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Reject tracked secrets and generated data
        run: bash scripts/check-secrets.sh

  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/api
    env:
      AI_RUNTIME_MODE: test
      DATABASE_URL: sqlite+aiosqlite:////tmp/scant-ci-backend.sqlite
      SCANT_REQUIRE_NETWORK_NAMESPACE: "1"
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: apps/api/requirements.txt
      - name: Install backend dependencies
        run: python -m pip install -r requirements.txt
      - name: Run deterministic backend without external network
        run: ../../scripts/run-without-network.sh python -m pytest -q

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/web
    env:
      SCANT_REQUIRE_NETWORK_NAMESPACE: "1"
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install frontend dependencies
        run: npm ci
      - name: Run frontend tests without external network
        run: ../../scripts/run-without-network.sh npm test
      - name: Typecheck without external network
        run: ../../scripts/run-without-network.sh npm run typecheck
      - name: Lint error gate without external network
        run: ../../scripts/run-without-network.sh npm run lint
      - name: Build production frontend without external network
        run: ../../scripts/run-without-network.sh npm run build

  migrations:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/api
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: scant_ci
          POSTGRES_PASSWORD: scant_ci_password
          POSTGRES_DB: scant_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U scant_ci -d scant_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: apps/api/requirements.txt
      - name: Install backend dependencies
        run: python -m pip install -r requirements.txt
      - name: Validate deterministic SQLite migration paths
        run: >-
          python -m pytest -q
          tests/test_migration_schema_registry.py
          tests/test_alembic_sqlite_matrix.py
          tests/test_migration_runner.py
          tests/test_database_startup_policy.py
      - name: Validate PostgreSQL migration paths
        env:
          SCANT_TEST_POSTGRES_URL: postgresql+asyncpg://scant_ci:scant_ci_password@127.0.0.1:5432/scant_ci
        run: python -m pytest --run-live -q tests/test_alembic_postgresql.py
      - name: Validate Alembic graph and metadata
        env:
          DATABASE_URL: sqlite+aiosqlite:////tmp/scant-ci-migration.sqlite
        run: |
          alembic heads
          alembic history
          alembic upgrade head
          alembic check
